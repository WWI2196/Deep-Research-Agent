[project]
name = "deep-research-agent"
version = "1.0.0"
description = "Cross-platform deep research desktop application"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "trafilatura>=2.0.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.4.1",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "bm25s>=0.3.8",
    "jieba>=0.42.1",
    "python-multipart>=0.0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
